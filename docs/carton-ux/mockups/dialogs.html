<!doctype html><html class="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="skin.css">
<script src="icons.js"></script><script src="kit.js"></script><script src="story.js"></script></head><body><script>
const frames = [];
// ---- Fold in: from a cut into a cut, every change in words, pick what comes; conflicts inline ----
const frow = (on, tc, kind, badge, words, by, extra = "") => `<div style="display:grid;grid-template-columns:16px 34px 18px 1fr;gap:0 8px;align-items:start;padding:8px 10px;border-radius:8px;${on === null ? "opacity:.6" : ""}">
  ${on === "lock" ? `<span class="cbx" style="margin-top:1px;box-shadow:none;background:#ffffff1a;color:var(--fg3)" title="Can't be left out">${I("lock", 10)}</span>` : `<span class="cbx${on ? " on" : ""}" style="margin-top:1px">${on ? I("check") : ""}</span>`}<span class="tc muted tnum" style="font-size:12.5px">${tc}</span>
  <span class="kind ${kind}">${I({ v: "film", t: "text", c: "cc", a: "music", p: "layers" }[kind])}${badge ? `<b class="b-${badge}">${{ add: "+", rem: "−", chg: "" }[badge]}</b>` : ""}</span>
  <span style="color:var(--fg1);font-size:12.5px;line-height:17px">${words}<span style="display:block;color:var(--fg4);font-size:11.5px">${by}</span>${extra}</span></div>`;
const pickRow = `<div style="margin:2px 0 4px;padding:10px;border-radius:8px;background:#fbbd230d;box-shadow:inset 0 0 0 1px #fbbd2333">
  <div style="display:flex;gap:8px;align-items:center;color:var(--fg1);font-weight:500;font-size:12.5px"><span style="color:var(--warn)">${I("warning", 14)}</span>Both cuts moved “Interview B”. Pick one:</div>
  <div style="display:flex;flex-direction:column;gap:2px;margin:8px 0 0 22px;font-size:12.5px">
    <label style="display:flex;gap:8px;align-items:center"><span class="radio"></span>Main cut's: starts at 0:18 <span class="dim">· You</span></label>
    <label style="display:flex;gap:8px;align-items:center"><span class="radio on"></span>30s Instagram cut's: starts at 0:20 <span class="dim">· Director</span></label></div></div>`;
const fold = ({ rows, foot, primary, lead = "Main cut gets what changed on “30s Instagram cut” since it was made from Main cut at 12:20 pm.", w = 600, h }) => `
  <div class="dialog" style="width:${w}px">
    <div class="dh"><h3>Fold in changes</h3><span style="flex:1"></span><button class="btn icon">${I("x", 16)}</button></div>
    <div class="db">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px"><span class="muted">From</span><span class="selectish">${I("cut")}30s Instagram cut${I("caret", 11)}</span><span class="muted">into</span><span class="selectish">${I("cut")}Main cut <span class="dim" style="font-weight:400">· you're on it</span>${I("caret", 11)}</span></div>
      <p class="muted" style="margin:0 0 12px;font-size:12.5px;line-height:17px">${lead}</p>
      ${rows}
    </div>
    <div class="df"><span class="hint" style="max-width:300px">${foot}</span><span class="sp"></span><button class="btn sec">Cancel</button><button class="btn pri">${I("foldIn")}${primary}</button></div>
  </div>`;
const head4 = (n, sel) => `<div style="display:flex;align-items:center;padding:0 10px 4px;font-size:12px" class="muted"><span>${n} changes</span><span style="flex:1"></span><span class="link" style="font-size:12px">${sel}</span></div>`;
const r1 = frow(true, "0:00", "v", "chg", "Trimmed “Intro”, now ends at 0:03", "Director · 2 h ago");
const r2 = frow(true, "0:03", "t", "chg", "Changed “Summer launch” to “Summer sale”", "You · 1 h ago");
const r3 = (on) => frow(on, "0:12", "v", "rem", "Removed “Product close-up”", "Director · 1 h ago");
const r4 = frow("lock", "—", "p", "chg", "Changed the aspect ratio to 9:16", "Director · 2 h ago", `<span style="display:block;color:var(--fg4);font-size:11.5px">Can't be left out: it's a setting for the whole project</span>`);
frames.push(shot("fold-all", 600, 0, fold({ rows: head4(4, "Select none") + `<div style="border-radius:10px;box-shadow:inset 0 0 0 1px var(--line2);padding:4px">${r1 + r2 + r3(true) + r4}</div>`, foot: "Ctrl+Z takes the whole fold back.", primary: "Fold in 4 changes" })));
frames.push(shot("fold-some", 600, 0, fold({ rows: head4(4, "Select all") + `<div style="border-radius:10px;box-shadow:inset 0 0 0 1px var(--line2);padding:4px">${r1 + r2 + r3(false) + r4}</div>`, foot: "1 change is left out. It stays on “30s Instagram cut”, and you can fold it in later.", primary: "Fold in 3 changes" })));
frames.push(shot("fold-conflict", 600, 0, fold({ rows: head4(4, "Select none") + `<div style="border-radius:10px;box-shadow:inset 0 0 0 1px var(--line2);padding:4px">${r1 + r2 + r4}${pickRow}</div>`, foot: "", primary: "Fold in 4 changes" })));
frames.push(shot("fold-rest", 600, 0, fold({ lead: "1 change was left out when you folded this cut in on Oct 30. It can come in now.", rows: `<div style="border-radius:10px;box-shadow:inset 0 0 0 1px var(--line2);padding:4px">${frow(true, "0:12", "v", "rem", "Removed “Product close-up”", "Director · Oct 30", `<span class="pill" style="margin-top:4px">Left out on Oct 30</span>`)}</div>`, foot: "", primary: "Fold in the rest" })));
frames.push(shot("fold-nothing", 600, 0, `<div class="dialog" style="width:600px"><div class="dh"><h3>Fold in changes</h3><span style="flex:1"></span><button class="btn icon">${I("x", 16)}</button></div><div class="db"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span class="muted">From</span><span class="selectish">${I("cut")}Client review${I("caret", 11)}</span><span class="muted">into</span><span class="selectish">${I("cut")}Main cut${I("caret", 11)}</span></div><p style="margin:0;color:var(--fg1)">Main cut already has everything from “Client review”.</p></div><div class="df"><span class="sp"></span><button class="btn sec">Close</button></div></div>`));

// ---- Share: a dialog from the title bar's Share icon (Cardboard's dialog look), not a side-panel form ----
const person = (w, name, role, status, sub = "") => `<div style="display:flex;align-items:center;gap:10px;padding:8px 0">${av(w, false, status === "here" ? "live" : "")}<div style="flex:1;min-width:0"><div style="color:var(--fg1)">${name}</div>${sub ? `<div class="dim" style="font-size:12px">${sub}</div>` : ""}</div><span class="muted" style="font-size:12.5px">${role}</span></div>`;
const share = (body, foot, w = 520) => `<div class="dialog" style="width:${w}px"><div class="dh"><h3>Share “Weekend reel”</h3><span style="flex:1"></span>${foot.status ?? ""}<button class="btn icon">${I("x", 16)}</button></div><div class="db">${body}</div>${foot.html ? `<div class="df">${foot.html}</div>` : ""}</div>`;
frames.push(shot("share-first", 520, 0, share(`
  <p class="muted" style="margin:0 0 14px;font-size:12.5px;line-height:18px">Edit together, live, with the whole history. Teammates get preview copies of your video; the originals stay on this computer.</p>
  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="field"><label>Sharing server</label><div class="input focus">share.northlight.studio<span class="caret"></span></div><span class="hint">The address whoever runs your sharing server gave you.</span></div>
    <div class="field"><label>Your name</label><div class="input">Vikas</div><span class="hint">Teammates see this beside your edits.</span></div>
  </div>`, { html: `<span class="sp"></span><button class="btn sec">Cancel</button><button class="btn pri">Share project</button>` })));
frames.push(shot("share-unreachable", 520, 0, share(`
  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="field"><label>Sharing server</label><div class="input" style="box-shadow:inset 0 0 0 1px #e3787899">share.northlight.studo</div><span class="err">Can't reach this address. Check it, and your internet connection.</span></div>
    <div class="field"><label>Your name</label><div class="input">Vikas</div></div>
  </div>`, { html: `<span class="sp"></span><button class="btn sec">Cancel</button><button class="btn pri">Share project</button>` })));
frames.push(shot("share-owner", 520, 0, share(`
  <div class="mlabel" style="padding:4px 0">People</div>
  ${person("you", "You", "Owner", "here", "Vikas · here now")}
  ${person("leo", "Leo", "Can edit", "here", "Here now · editing captions")}
  <div style="margin-left:30px">${person("leoDirector", "Leo's Director", "", "", "Working on “Add a title card”")}</div>
  ${person("mia", "Mia", "Can comment", "", "Last here yesterday")}
  <div class="msep" style="margin:10px 0"></div>
  <div class="mlabel" style="padding:4px 0">Invite</div>
  <div style="display:flex;gap:8px;align-items:center;margin-top:6px"><span class="selectish">Can edit${I("caret", 11)}</span><div class="input" style="flex:1;min-width:0;font-size:12px;color:var(--fg2);overflow:hidden;white-space:nowrap">share.northlight.studio/#join=Weekend-reel…</div><button class="btn sec">${I("copy", 14)}Copy link</button></div>
  <p class="hint" style="margin:6px 0 0">Anyone with this link can join and edit.</p>`,
  { status: `<span style="display:inline-flex;align-items:center;gap:6px;color:#86efac;font-size:12.5px;margin-right:6px">${I("cloudCheck", 14)}Up to date</span>` })));
frames.push(shot("share-offline", 520, 0, share(`
  <div style="display:flex;gap:10px;padding:10px;border-radius:8px;background:#fbbd230d;box-shadow:inset 0 0 0 1px #fbbd2333;color:var(--fg1);font-size:12.5px;line-height:17px">${I("cloudSlash", 16, "warn")}<div><b style="font-weight:600">You're offline.</b> Keep editing: 3 changes are saved here and are sent when you're back.</div></div>
  <div class="mlabel" style="padding:12px 0 4px">People</div>
  ${person("you", "You", "Owner", "", "Vikas")}
  ${person("leo", "Leo", "Can edit", "", "Last seen 4 min ago")}`, { status: "" })));
// ---- Join, from the Dashboard ----
frames.push(shot("join-dialog", 480, 0, `<div class="dialog" style="width:480px"><div class="dh"><h3>Join a shared project</h3><span style="flex:1"></span><button class="btn icon">${I("x", 16)}</button></div><div class="db">
  <p class="muted" style="margin:0 0 12px;font-size:12.5px;line-height:18px">Paste the invite link a teammate sent you. The project comes with its history; its footage arrives as their computer sends it.</p>
  <div style="display:flex;flex-direction:column;gap:12px"><div class="field"><label>Invite link</label><div class="input focus">https://share.northlight.studio/#join=Weekend-reel-7f…<span class="caret"></span></div></div>
  <p class="hint" style="margin:0">You'll join as <b style="color:var(--fg1);font-weight:500">Leo</b>. <span class="link">Change</span></p></div></div>
  <div class="df"><span class="sp"></span><button class="btn sec">Cancel</button><button class="btn pri">Join and open</button></div></div>`));
build(frames.join(""));
</script></body></html>

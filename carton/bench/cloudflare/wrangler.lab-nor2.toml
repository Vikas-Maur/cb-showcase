# cf-lab: the real Carton Worker (no R2: blobs in the BlobVault Durable Object), deployed for the lab under its own name. Never
# the live showcase Worker. Locked: no open creation, so every session comes from an invite only ADMIN_TOKEN can make
# (both secrets are set with `wrangler secret put`, never here), and the daily write cap below.
name = "carton-lab-nor2"
main = "lab-worker.ts"
compatibility_date = "2026-10-23"
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "PROJECT_ROOM"
class_name = "ProjectRoom"

[[durable_objects.bindings]]
name = "BLOB_VAULT"
class_name = "BlobVault"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProjectRoom", "BlobVault"]

[vars]
ARCHIVE_EVERY_MS = "3600000"
PRESENCE_TIMEOUT_MS = "120000"
# the daily write cap (src/write-cap.ts): bytes stored and blob write calls per UTC day, across every project
WRITE_CAP_BYTES_PER_DAY = "2147483648"
WRITE_CAP_OPS_PER_DAY = "20000"

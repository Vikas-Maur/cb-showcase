# Carton on Cloudflare: the PRODUCTION Worker, deployed from the `deploy/carton` branch by the GitHub workflow
# .github/workflows/deploy-site.yml (it replaced Cloudflare's Workers Builds): build-site.mjs builds the static files into
# ./dist/site first, then `wrangler deploy` ships them and the API together. Local development stays on wrangler.toml.
# Secrets are set in the dashboard (Worker → Settings → Variables and Secrets), never here: AUTH_SECRET (required; signs
# invites and sessions) and, optionally, ADMIN_TOKEN (makes a first owner invite; open creation below needs none).
# The live Worker is `cardboard-showcase`: the workflow deploys with `--name cardboard-showcase`, over the old name below.
name = "carton"
main = "src/worker.ts"
compatibility_date = "2026-10-23"

# The static files (build-site.mjs: a plain landing page and the changelog; the web demo isn't served for now). The
# Worker answers /api/* and /blob/* first; everything else is a file from here.
[assets]
directory = "./dist/site"
binding = "ASSETS"
run_worker_first = ["/api/*", "/blob/*"]

[[durable_objects.bindings]]
name = "PROJECT_ROOM"
class_name = "ProjectRoom"

# The DO-blob fallback (L11). Used only when BLOBS (R2) is not bound.
[[durable_objects.bindings]]
name = "BLOB_VAULT"
class_name = "BlobVault"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProjectRoom", "BlobVault"]

# No R2 for now (the user's choice): media, keyframes and archived change segments go to the BLOB_VAULT Durable Object
# fallback (L11), which passes the same blob-store suites. To move to R2 later, create the bucket and add:
#   [[r2_buckets]]
#   binding = "BLOBS"
#   bucket_name = "carton"

[vars]
# the newest document schemaVersion clients may send in hello. Unset, it is the Cardboard adapter's
# CARDBOARD_SCHEMA_VERSION this Worker is built with; set it only to pin a deployment (H-SV: a pinned "1" refused
# every client once the adapter moved to 2).
# SCHEMA_VERSION = "2"
# how often the alarm runs the sequencer's maintenance (archiving old rows per §18, sweeping envelope blobs);
# ARCHIVE_KEEP / ARCHIVE_SEGMENT override the sequencer's §18 defaults (10,000 / 10,000)
ARCHIVE_EVERY_MS = "3600000"
# a socket that shows presence and is silent (no message, no keepalive ping) this long is closed, so its teammates stop
# showing its cursor; "0" = never
PRESENCE_TIMEOUT_MS = "120000"
# media dedup within a team (§11, R2 only): a JSON object from project id to team id; unlisted projects keep their own
# media scope
# TEAMS = '{"film-a":"studio","film-b":"studio"}'
# the most keys one POST /blobs/heads checks (default 200, at most 1000): each is one to four R2 calls, and a Worker
# request's subrequests are limited per plan; the client asks again for the rest
# BLOB_HEADS_PER_REQUEST = "200"
# Open creation (the free web demo): anyone who opens the site may create a project and become its owner, with no
# admin token (the desktop app's Share then needs only the host address and a name). Each project id is claimed once
# and never one already in use, so nobody can take over an existing project with it. The safety caps:
# OPEN_CREATE_PER_DAY, new projects per IP address per UTC day; MAX_UPLOAD_BYTES, the largest file one upload stores
# (200 MiB: blobs live in the BlobVault Durable Object for now).
OPEN_CREATE = "1"
OPEN_CREATE_PER_DAY = "10"
MAX_UPLOAD_BYTES = "209715200"
# The daily write cap (src/write-cap.ts), across every project: bytes stored and blob write calls per UTC day. Over
# either, writes answer 429 (code DailyWriteCap, Retry-After until 00:00 UTC); reads and deletes go on. Off unless set.
# Each write then costs one more Durable Object request (the day's counter).
# WRITE_CAP_BYTES_PER_DAY = "2147483648"
# WRITE_CAP_OPS_PER_DAY = "20000"

# Phase B of the Carton build: the agents' "Measurements to run" re-run on hosted runners (AGENTS.md rule 6), one job
# per measurement of carton/ci/measure.json. Runs only for a push to ci/carton whose head commit's message names
# measurements: `[carton-measure agents=stores,ui]`, `[carton-measure ids=ui-bench]`, or `[carton-measure]` for all.
# Linux runners: these are timing and size claims about portable code; a hosted runner is a shared VM, so only
# comparisons made inside one job are trusted. Each job uploads its raw results (never builds).
name: Carton measurements

on:
  push:
    branches: [ci/carton]

# Only a push that names measurements cancels the measurement run it supersedes; every other push (its run is
# skipped) and a re-run get a group of their own.
concurrency:
  group: carton-measure-${{ github.ref }}-${{ (github.run_attempt == '1' && contains(github.event.head_commit.message, '[carton-measure')) && 'latest' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    if: contains(github.event.head_commit.message, '[carton-measure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: carton/ci
      - id: plan
        env:
          CARTON_CI_MESSAGE: ${{ github.event.head_commit.message }}
        run: node carton/ci/plan.mjs --measure

  measure:
    needs: plan
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: carton
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: carton/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Restore tools
        id: tools
        if: matrix.needs != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/carton-ci-cache
          key: carton-measure-tools-${{ runner.arch }}-${{ matrix.id }}-${{ hashFiles('carton/ci/fetch.mjs', 'carton/ci/measure.json') }}

      - name: Fetch tools ${{ matrix.needs }}
        run: node ci/fetch.mjs ${{ matrix.needs }}

      - name: Save tools
        if: matrix.needs != '' && steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/carton-ci-cache
          key: carton-measure-tools-${{ runner.arch }}-${{ matrix.id }}-${{ hashFiles('carton/ci/fetch.mjs', 'carton/ci/measure.json') }}

      - name: Measure ${{ matrix.id }}
        run: node ci/measure.mjs --id ${{ matrix.id }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carton-measure-${{ matrix.id }}
          path: ${{ runner.temp }}/carton-results
          if-no-files-found: ignore
          retention-days: 30
